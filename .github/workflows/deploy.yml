name: Refresh Simkl and global upcoming releases

on:
  workflow_dispatch:
  # Regenerate on actual code changes too, not only Studio poster settings.
  # Otherwise a season-mapping fix waits for the next scheduled refresh.
  push:
    branches: [main]
    paths:
      - "config/poster-style.json"
      - "src/**"
      - "scripts/**"
      - "assets/fonts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  schedule:
    # Run once per hour, away from GitHub's busy top-of-hour period.
    - cron: "23 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

# Only the newest refresh matters. Cancel an older queued/running refresh instead
# of allowing multiple Pages deployments to block one another.
concurrency:
  group: simkl-nextup-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Simkl plus global discovery
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Recover the original font even if a replacement archive omits it.
          fetch-depth: 0

      - name: Ensure poster font is available
        run: |
          if [ ! -s assets/fonts/Inter-ExtraBold.otf ]; then
            echo "Poster font missing; restoring it from the repository commit before it was deleted."
            mkdir -p assets/fonts
            git show de46231:assets/fonts/Inter-ExtraBold.otf > assets/fonts/Inter-ExtraBold.otf
          fi
          test -s assets/fonts/Inter-ExtraBold.otf

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect second Simkl account
        id: account2
        env:
          SECOND_TOKEN: ${{ secrets.SIMKL_ACCESS_TOKEN_2 }}
        run: |
          if [ -n "$SECOND_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Second Simkl account is enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SIMKL_ACCESS_TOKEN_2 is absent; deploying the existing root account only."
          fi

      - name: Detect third Simkl account (anime only)
        id: account3
        env:
          THIRD_TOKEN: ${{ secrets.SIMKL_ACCESS_TOKEN_3 }}
        run: |
          if [ -n "$THIRD_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Third Simkl account (anime) is enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SIMKL_ACCESS_TOKEN_3 is absent; account-3 stays a setup placeholder."
          fi

      - name: Keep scheduled workflows active
        run: |
          node scripts/update-keepalive.mjs
          if git diff --quiet -- .github/keepalive; then
            echo "Monthly keepalive is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keep scheduled workflows active"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Restore primary private sync state
        id: restore-primary-state
        uses: actions/cache/restore@v4
        with:
          path: state/simkl-state.json
          key: simkl-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            simkl-state-

      - name: Restore account 2 private TV sync state
        if: steps.account2.outputs.enabled == 'true'
        id: restore-account2-state
        uses: actions/cache/restore@v4
        with:
          path: state/account-2/simkl-state.json
          key: simkl-account-2-tv-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            simkl-account-2-tv-state-

      - name: Restore account 2 private movie release cache
        if: steps.account2.outputs.enabled == 'true'
        uses: actions/cache/restore@v4
        with:
          path: state/account-2/movie-release-state.json
          key: simkl-account-2-movie-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            simkl-account-2-movie-state-

      - name: Restore global discovery snapshot
        if: steps.account2.outputs.enabled == 'true'
        uses: actions/cache/restore@v4
        with:
          path: state/account-2/discovery-state.json
          key: global-discovery-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            global-discovery-v1-

      - name: Restore account 3 private anime sync state
        if: steps.account3.outputs.enabled == 'true'
        uses: actions/cache/restore@v4
        with:
          path: state/account-3/simkl-state.json
          key: simkl-account-3-anime-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            simkl-account-3-anime-state-

      - name: Run tests
        run: npm test

      - name: Refresh primary anime account at root
        env:
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_ACCESS_TOKEN: ${{ secrets.SIMKL_ACCESS_TOKEN }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          TVDB_SUBSCRIBER_PIN: ${{ secrets.TVDB_SUBSCRIBER_PIN }}
          TVDB_SEASON_TYPE: ${{ vars.TVDB_SEASON_TYPE }}
          TVDB_LANGUAGE: ${{ vars.TVDB_LANGUAGE }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          ANIMESCHEDULE_TOKEN: ${{ secrets.ANIMESCHEDULE_TOKEN }}
          MAX_CATALOG_ITEMS: 50
          POSTER_BADGES: "true"
          MEDIA_TYPE: anime
        run: npm run refresh

      - name: Verify primary anime addon
        env:
          SIMKL_ACCESS_TOKEN: ${{ secrets.SIMKL_ACCESS_TOKEN }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          TVDB_SUBSCRIBER_PIN: ${{ secrets.TVDB_SUBSCRIBER_PIN }}
          ANIMESCHEDULE_TOKEN: ${{ secrets.ANIMESCHEDULE_TOKEN }}
          MEDIA_TYPE: anime
        run: npm run verify

      - name: Save primary private sync state
        uses: actions/cache/save@v4
        with:
          path: state/simkl-state.json
          key: simkl-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish account 2 authorization placeholder
        if: steps.account2.outputs.enabled != 'true'
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          PUBLIC_PATH_PREFIX: account-2
          OUTPUT_DIRECTORY: public/account-2
          ADDON_ID: community.simkl.new-tv-episodes.account2
          CATALOG_ID: simkl-new-tv-episodes-account2
          CATALOG_NAME: Account 2 · TV Up Next · Simkl
          ADDON_NAME: Simkl TV Up Next · Account 2
          SITE_TITLE: Account 2 TV Up Next
          ACCOUNT_LABEL: Simkl Account 2
          SETUP_SECRET_NAME: SIMKL_ACCESS_TOKEN_2
          MEDIA_TYPE: tv
        run: npm run build:placeholder

      - name: Refresh account 2 TV shows under /account-2
        if: steps.account2.outputs.enabled == 'true'
        env:
          SIMKL_CLIENT_ID_2: ${{ secrets.SIMKL_CLIENT_ID_2 }}
          SIMKL_CLIENT_ID_PRIMARY: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_ACCESS_TOKEN: ${{ secrets.SIMKL_ACCESS_TOKEN_2 }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          TVDB_SUBSCRIBER_PIN: ${{ secrets.TVDB_SUBSCRIBER_PIN }}
          TVDB_SEASON_TYPE: ${{ vars.TVDB_SEASON_TYPE }}
          TVDB_LANGUAGE: ${{ vars.TVDB_LANGUAGE }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          PUBLIC_PATH_PREFIX: account-2
          OUTPUT_DIRECTORY: public/account-2
          SIMKL_STATE_FILE: state/account-2/simkl-state.json
          ADDON_ID: community.simkl.new-tv-episodes.account2
          CATALOG_ID: simkl-new-tv-episodes-account2
          CATALOG_NAME: Account 2 · TV Up Next · Simkl
          ADDON_NAME: Simkl TV Up Next · Account 2
          SITE_TITLE: Account 2 TV Up Next
          ACCOUNT_LABEL: Simkl Account 2
          SETUP_SECRET_NAME: SIMKL_ACCESS_TOKEN_2
          MAX_CATALOG_ITEMS: 50
          POSTER_BADGES: "true"
          MEDIA_TYPE: tv
        run: |
          export SIMKL_CLIENT_ID="${SIMKL_CLIENT_ID_2:-$SIMKL_CLIENT_ID_PRIMARY}"
          if [ -z "$SIMKL_CLIENT_ID" ]; then
            echo "Neither SIMKL_CLIENT_ID_2 nor SIMKL_CLIENT_ID is configured." >&2
            exit 1
          fi
          npm run refresh

      - name: Refresh Account 2 movie home-release row in the SAME addon
        if: steps.account2.outputs.enabled == 'true'
        env:
          SIMKL_CLIENT_ID_2: ${{ secrets.SIMKL_CLIENT_ID_2 }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_ACCESS_TOKEN_2: ${{ secrets.SIMKL_ACCESS_TOKEN_2 }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          MOVIE_COMING_SOON_DAYS: 30
          MAX_MOVIE_ITEMS: 50
        run: npm run refresh:movies

      - name: Refresh globally upcoming movies and TV premieres
        if: steps.account2.outputs.enabled == 'true'
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          MAX_DISCOVERY_MOVIES: 50
          MAX_DISCOVERY_TV: 50
        run: npm run refresh:discovery

      - name: Add independent Account 2 Smart Shuffle movie row
        if: steps.account2.outputs.enabled == 'true'
        env:
          SIMKL_CLIENT_ID_2: ${{ secrets.SIMKL_CLIENT_ID_2 }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_ACCESS_TOKEN_2: ${{ secrets.SIMKL_ACCESS_TOKEN_2 }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: npm run refresh:smart

      - name: Verify account 2 TV addon
        if: steps.account2.outputs.enabled == 'true'
        env:
          OUTPUT_DIRECTORY: public/account-2
          ADDON_ID: community.simkl.new-tv-episodes.account2
          CATALOG_ID: simkl-new-tv-episodes-account2
          SIMKL_ACCESS_TOKEN: ${{ secrets.SIMKL_ACCESS_TOKEN_2 }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          TVDB_SUBSCRIBER_PIN: ${{ secrets.TVDB_SUBSCRIBER_PIN }}
          MEDIA_TYPE: tv
          VERIFY_MOVIE_ROW: "true"
          VERIFY_DISCOVERY: "true"
          VERIFY_SMART_SHUFFLE: "true"
        run: npm run verify

      - name: Assert account 2 output is TV, not anime
        if: steps.account2.outputs.enabled == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const manifest = JSON.parse(await readFile("public/account-2/manifest.json", "utf8"));
          const status = JSON.parse(await readFile("public/account-2/status.json", "utf8"));
          if (manifest.id !== "community.simkl.new-tv-episodes.account2") {
            throw new Error(`Wrong account-2 addon ID: ${manifest.id}`);
          }
          if (manifest.catalogs?.[0]?.id !== "simkl-new-tv-episodes-account2") {
            throw new Error(`Wrong account-2 catalog ID: ${manifest.catalogs?.[0]?.id}`);
          }
          if (manifest.catalogs?.[1]?.id !== "simkl-plan-to-watch-home-releases-account2" || manifest.catalogs?.[1]?.type !== "movie") {
            throw new Error("Second movie catalog is missing from the same account-2 manifest.");
          }
          if (!manifest.types?.includes("movie") || !status.movieRow) {
            throw new Error("Account-2 movie row was not correctly published.");
          }
          if (manifest.catalogs?.[2]?.id !== "global-upcoming-movies" || manifest.catalogs?.[2]?.type !== "movie"
            || manifest.catalogs?.[3]?.id !== "global-upcoming-tv" || manifest.catalogs?.[3]?.type !== "series"
            || !status.discovery) {
            throw new Error("The two public discovery rows are missing.");
          }
          if (manifest.catalogs?.[4]?.id !== "simkl-movies-smart-shuffle-account2"
            || manifest.catalogs?.[4]?.type !== "movie" || !status.smartShuffle) {
            throw new Error("Fifth Smart Shuffle catalog is missing.");
          }
          if (status.mediaType !== "tv") {
            throw new Error(`Wrong account-2 mediaType: ${status.mediaType}`);
          }
          console.log(`Confirmed account 2 TV output: ${status.catalogItems} title(s).`);
          NODE

      - name: Save account 2 private TV sync state
        if: steps.account2.outputs.enabled == 'true'
        uses: actions/cache/save@v4
        with:
          path: state/account-2/simkl-state.json
          key: simkl-account-2-tv-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save account 2 private movie release cache
        if: steps.account2.outputs.enabled == 'true'
        uses: actions/cache/save@v4
        with:
          path: state/account-2/movie-release-state.json
          key: simkl-account-2-movie-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save private global discovery snapshot
        if: steps.account2.outputs.enabled == 'true'
        uses: actions/cache/save@v4
        with:
          path: state/account-2/discovery-state.json
          key: global-discovery-v1-${{ github.run_id }}-${{ github.run_attempt }}

      # ---------------- Account 3: anime only, under /account-3 ----------------
      # Same anime pipeline as the root account, but with its own token, state
      # file, cache prefix, output folder, addon ID and catalog ID.

      - name: Publish account 3 authorization placeholder
        if: steps.account3.outputs.enabled != 'true'
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          PUBLIC_PATH_PREFIX: account-3
          OUTPUT_DIRECTORY: public/account-3
          ADDON_ID: community.simkl.new-anime-episodes.account3
          CATALOG_ID: simkl-new-anime-episodes-account3
          CATALOG_NAME: Account 3 · Anime Up Next · Simkl
          ADDON_NAME: Simkl Anime Up Next · Account 3
          SITE_TITLE: Account 3 Anime Up Next
          ACCOUNT_LABEL: Simkl Account 3
          SETUP_SECRET_NAME: SIMKL_ACCESS_TOKEN_3
          MEDIA_TYPE: anime
        run: npm run build:placeholder

      - name: Refresh account 3 anime under /account-3
        if: steps.account3.outputs.enabled == 'true'
        env:
          SIMKL_CLIENT_ID_3: ${{ secrets.SIMKL_CLIENT_ID_3 }}
          SIMKL_CLIENT_ID_PRIMARY: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_ACCESS_TOKEN: ${{ secrets.SIMKL_ACCESS_TOKEN_3 }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          TVDB_SUBSCRIBER_PIN: ${{ secrets.TVDB_SUBSCRIBER_PIN }}
          TVDB_SEASON_TYPE: ${{ vars.TVDB_SEASON_TYPE }}
          TVDB_LANGUAGE: ${{ vars.TVDB_LANGUAGE }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          ANIMESCHEDULE_TOKEN: ${{ secrets.ANIMESCHEDULE_TOKEN }}
          PUBLIC_PATH_PREFIX: account-3
          OUTPUT_DIRECTORY: public/account-3
          SIMKL_STATE_FILE: state/account-3/simkl-state.json
          ADDON_ID: community.simkl.new-anime-episodes.account3
          CATALOG_ID: simkl-new-anime-episodes-account3
          CATALOG_NAME: Account 3 · Anime Up Next · Simkl
          ADDON_NAME: Simkl Anime Up Next · Account 3
          SITE_TITLE: Account 3 Anime Up Next
          ACCOUNT_LABEL: Simkl Account 3
          SETUP_SECRET_NAME: SIMKL_ACCESS_TOKEN_3
          MAX_CATALOG_ITEMS: 50
          POSTER_BADGES: "true"
          MEDIA_TYPE: anime
        run: |
          export SIMKL_CLIENT_ID="${SIMKL_CLIENT_ID_3:-$SIMKL_CLIENT_ID_PRIMARY}"
          if [ -z "$SIMKL_CLIENT_ID" ]; then
            echo "Neither SIMKL_CLIENT_ID_3 nor SIMKL_CLIENT_ID is configured." >&2
            exit 1
          fi
          npm run refresh

      - name: Verify account 3 anime addon
        if: steps.account3.outputs.enabled == 'true'
        env:
          OUTPUT_DIRECTORY: public/account-3
          ADDON_ID: community.simkl.new-anime-episodes.account3
          CATALOG_ID: simkl-new-anime-episodes-account3
          SIMKL_ACCESS_TOKEN: ${{ secrets.SIMKL_ACCESS_TOKEN_3 }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          TVDB_SUBSCRIBER_PIN: ${{ secrets.TVDB_SUBSCRIBER_PIN }}
          ANIMESCHEDULE_TOKEN: ${{ secrets.ANIMESCHEDULE_TOKEN }}
          MEDIA_TYPE: anime
        run: npm run verify

      - name: Assert account 3 output is anime only
        if: steps.account3.outputs.enabled == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const manifest = JSON.parse(await readFile("public/account-3/manifest.json", "utf8"));
          const status = JSON.parse(await readFile("public/account-3/status.json", "utf8"));
          if (manifest.id !== "community.simkl.new-anime-episodes.account3") {
            throw new Error(`Wrong account-3 addon ID: ${manifest.id}`);
          }
          if (manifest.catalogs?.length !== 1 || manifest.catalogs[0].id !== "simkl-new-anime-episodes-account3") {
            throw new Error(`Account 3 must publish exactly one anime catalog, got: ${JSON.stringify(manifest.catalogs?.map((c) => c.id))}`);
          }
          if (status.mediaType !== "anime") {
            throw new Error(`Wrong account-3 mediaType: ${status.mediaType}`);
          }
          console.log(`Confirmed account 3 anime output: ${status.catalogItems} title(s).`);
          NODE

      - name: Save account 3 private anime sync state
        if: steps.account3.outputs.enabled == 'true'
        uses: actions/cache/save@v4
        with:
          path: state/account-3/simkl-state.json
          key: simkl-account-3-anime-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    name: Deploy verified site to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy both addons to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub's default is 10 minutes. Allow longer temporary Pages queues.
          timeout: 1800000
