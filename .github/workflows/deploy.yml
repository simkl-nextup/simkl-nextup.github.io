name: Refresh Simkl catalogs and deploy Pages

on:
  workflow_dispatch:
  schedule:
    # Run once per hour, away from GitHub's busy top-of-hour period.
    - cron: "23 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: simkl-new-episodes-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Keep scheduled workflows active
        run: |
          node scripts/update-keepalive.mjs
          if git diff --quiet -- .github/keepalive; then
            echo "Monthly keepalive is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keep scheduled workflows active"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Restore primary account state
        id: restore-primary-state
        uses: actions/cache/restore@v4
        with:
          path: state/simkl-state.json
          key: simkl-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            simkl-state-

      - name: Run tests
        run: npm test

      - name: Refresh primary account
        env:
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_ACCESS_TOKEN: ${{ secrets.SIMKL_ACCESS_TOKEN }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          TVDB_SUBSCRIBER_PIN: ${{ secrets.TVDB_SUBSCRIBER_PIN }}
          TVDB_SEASON_TYPE: ${{ vars.TVDB_SEASON_TYPE }}
          TVDB_LANGUAGE: ${{ vars.TVDB_LANGUAGE }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          MAX_CATALOG_ITEMS: 50
          POSTER_BADGES: "true"
        run: npm run refresh

      - name: Verify primary account
        env:
          SIMKL_ACCESS_TOKEN: ${{ secrets.SIMKL_ACCESS_TOKEN }}
          SIMKL_ACCESS_TOKEN_2: ${{ secrets.SIMKL_ACCESS_TOKEN_2 }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          TVDB_SUBSCRIBER_PIN: ${{ secrets.TVDB_SUBSCRIBER_PIN }}
        run: npm run verify

      - name: Save primary account state
        uses: actions/cache/save@v4
        with:
          path: state/simkl-state.json
          key: simkl-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore account 2 state and last good output
        id: restore_account_2
        uses: actions/cache/restore@v4
        with:
          path: |
            state/simkl-state-account-2.json
            public/account-2
          key: simkl-account-2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            simkl-account-2-

      - name: Ensure account 2 has a safe fallback
        run: |
          if [ ! -f public/account-2/manifest.json ]; then
            npm run build:placeholder:account-2
          fi

      - name: Refresh account 2 in an isolated build folder
        id: refresh_account_2
        continue-on-error: true
        env:
          SIMKL_CLIENT_ID_PRIMARY: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_ID_2: ${{ secrets.SIMKL_CLIENT_ID_2 }}
          SIMKL_ACCESS_TOKEN_2: ${{ secrets.SIMKL_ACCESS_TOKEN_2 }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          TVDB_SUBSCRIBER_PIN: ${{ secrets.TVDB_SUBSCRIBER_PIN }}
          TVDB_SEASON_TYPE: ${{ vars.TVDB_SEASON_TYPE }}
          TVDB_LANGUAGE: ${{ vars.TVDB_LANGUAGE }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          MAX_CATALOG_ITEMS: 50
          POSTER_BADGES: "true"
          SIMKL_PROFILE_BASE_PATH: account-2
          SIMKL_PROFILE_STATE_FILE: state/simkl-state-account-2.json
          SIMKL_PROFILE_OUTPUT_DIR: public/.account-2-build
          SIMKL_PROFILE_ADDON_ID: community.simkl.new-anime-episodes.account-2
          SIMKL_PROFILE_ADDON_NAME: Simkl Anime Up Next · Account 2
          SIMKL_PROFILE_CATALOG_ID: simkl-new-anime-episodes-account-2
          SIMKL_PROFILE_CATALOG_NAME: My Anime Up Next · Simkl 2
          SIMKL_PROFILE_SECRET_NAME: SIMKL_ACCESS_TOKEN_2
          SIMKL_PROFILE_PAGE_HEADING: My Anime Up Next · Simkl 2
          SIMKL_PROFILE_SETUP_TITLE: Authorize Simkl account 2
          SIMKL_PROFILE_SETUP_HEADING: Authorize the second personal addon
        run: |
          if [ -z "$SIMKL_ACCESS_TOKEN_2" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SIMKL_ACCESS_TOKEN_2 is not configured; publishing the included empty account-2 setup page."
            npm run build:placeholder:account-2
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          export SIMKL_CLIENT_ID="${SIMKL_CLIENT_ID_2:-$SIMKL_CLIENT_ID_PRIMARY}"
          export SIMKL_ACCESS_TOKEN="$SIMKL_ACCESS_TOKEN_2"
          npm run refresh

      - name: Verify isolated account 2 build
        id: verify_account_2
        if: steps.refresh_account_2.outputs.configured == 'true' && steps.refresh_account_2.outcome == 'success'
        continue-on-error: true
        env:
          VERIFY_OUTPUT_DIR: public/.account-2-build
          VERIFY_CATALOG_ID: simkl-new-anime-episodes-account-2
          SIMKL_ACCESS_TOKEN: ${{ secrets.SIMKL_ACCESS_TOKEN }}
          SIMKL_ACCESS_TOKEN_2: ${{ secrets.SIMKL_ACCESS_TOKEN_2 }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          TVDB_SUBSCRIBER_PIN: ${{ secrets.TVDB_SUBSCRIBER_PIN }}
        run: npm run verify

      - name: Promote verified account 2 build
        id: promote_account_2
        if: steps.refresh_account_2.outputs.configured == 'true' && steps.refresh_account_2.outcome == 'success' && steps.verify_account_2.outcome == 'success'
        run: |
          rm -rf public/account-2
          mv public/.account-2-build public/account-2
          echo "promoted=true" >> "$GITHUB_OUTPUT"

      - name: Preserve account 2 state and last good output
        if: steps.promote_account_2.outputs.promoted == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            state/simkl-state-account-2.json
            public/account-2
          key: simkl-account-2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report account 2 failure without blocking primary
        if: steps.refresh_account_2.outputs.configured == 'true' && (steps.refresh_account_2.outcome != 'success' || steps.verify_account_2.outcome != 'success')
        run: echo "::warning::Account 2 failed, so the last verified account-2 output was kept. The primary account will still deploy."

      - name: Remove temporary account 2 build
        if: always()
        run: rm -rf public/.account-2-build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
