name: Deploy setup page only

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: simkl-new-episodes-pages
  cancel-in-progress: false

jobs:
  deploy-setup:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload setup site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy setup site
        id: deployment
        uses: actions/deploy-pages@v4

